name: Build APK

on:
  push:
    branches: [main]
    paths: ['apps/**', '.github/workflows/build.yml', 'tools/**']
  workflow_dispatch:
    inputs:
      app:
        description: 'App folder under apps/ (e.g. hisaab)'
        required: true
        default: hisaab

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            list="${{ github.event.inputs.app }}"
          elif git rev-parse HEAD~1 >/dev/null 2>&1 && ! git diff --name-only HEAD~1 HEAD | grep -qE '^(\.github|tools)/'; then
            list=$(git diff --name-only HEAD~1 HEAD | grep '^apps/' | cut -d/ -f2 | sort -u)
          else
            list=$(ls apps)
          fi
          json=$(printf '%s\n' $list | while read a; do [ -f "apps/$a/pubspec.yaml" ] && echo "$a"; done | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "apps=$json" >> "$GITHUB_OUTPUT"
          echo "Building: $json"

  build:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read app label
        id: meta
        run: |
          label=$(cat app_label.txt 2>/dev/null || echo "${{ matrix.app }}")
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org app.${{ matrix.app }} --project-name ${{ matrix.app }} .
          python3 ../../tools/patch_manifest.py android/app/src/main/AndroidManifest.xml "${{ steps.meta.outputs.label }}"

      - name: Use a stable signing key (so updates install over older versions)
        run: |
          mkdir -p ~/.android
          cp ../../tools/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: flutter test
        run: |
          set +e
          flutter test --reporter expanded > test.log 2>&1
          code=$?
          cat test.log
          if [ $code -ne 0 ]; then
            python3 - <<'PY'
          import re
          log = open('test.log', encoding='utf-8', errors='replace').read()
          chunks = re.split(r'(?=══╡ EXCEPTION)|(?=\d\d:\d\d \+\d+ -\d+: .*\[E\])', log)
          bad = [c for c in chunks if 'EXCEPTION' in c[:40] or '[E]' in c[:200]]
          for c in (bad or [log[-6000:]])[:8]:
              msg = c[:3500].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print('::error title=flutter test::' + msg)
          PY
          fi
          exit $code
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.meta.outputs.label }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/${{ steps.meta.outputs.label }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.app }}-v${{ github.run_number }}
          name: ${{ steps.meta.outputs.label }} build ${{ github.run_number }}
          body: |
            Android APK for ${{ steps.meta.outputs.label }}.
            Download the .apk on your phone, open it, and allow "Install unknown apps" when asked.
          files: apps/${{ matrix.app }}/${{ steps.meta.outputs.label }}.apk
